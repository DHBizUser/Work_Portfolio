<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <title>David M Harris Business Card</title>
  
<style>
  body  {
      background-color: grey;
      margin: 100px 40vw;

  }
@page {

    size: 3.5in 2in;
    margin: 0mm;
}




.business-card {
width: 60mm;
height: 36mm;
    background-color: #ffffff;
    border: 0.5px dotted black;
    padding: 20px;
    /* text-align: center; */
    font-size: 16px;
}

.business-card hr {
    border: none; 
    border-top: 1px dashed slategray; 
    height: 1px; 
    margin: 10px 0; 
}

.profile-image {
    width: 100px;
    height: 100px;
    border: 2px solid lightgrey; 
}

@media print {
    /* Hide everything in the body by default */
    body * { 
         visibility: hidden;
         display: none; /* Use display: none instead of visibility: hidden to prevent empty space */ 
     } 

    /* Make the specific container visible */
    .business-card {
        display: block; /* Restore block display */
        visibility: visible;
        position: absolute; /* Position it at the top left of the print page */
        left: 0;
        top: 0;
        width: 100%;
    }

    /* Ensure all children within the printable area are also visible */
    .business-card * {
        visibility: visible;
        display: block; /* Adjust display properties as needed for your layout */
    }

    /* Optional: Remove screen-specific styles like shadows or wide margins */
    .page-wrap {
        padding: 0;
        margin: 0;
        box-shadow: none;
        max-width: none;
    }

    /* Control page breaks inside the content */
    img {
        break-inside: avoid;
    }
}

</style>

</head>

<body>


 <div class="business-card">
        <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="flower">
        <p class="full-name">Your Name</p>
   </div>
  
</body>
</html>
